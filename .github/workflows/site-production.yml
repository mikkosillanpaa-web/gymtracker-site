name: Site production
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymtracker-site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_MODE == 'github-actions'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.9'
      - name: Validate and build the production site
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python ohje/generate.py
          git -c core.whitespace=cr-at-eol diff --ignore-space-at-eol --exit-code -- ohje/index.html
          python ohje/validate.py
          node --test tools/site.test.mjs
          node tools/build.mjs
      - name: Deploy and verify the active Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/gymtracker-deploy.jsonl"
          previous_version="$(node tools/verify-worker-deploy.mjs before)"
          printf 'Previous Cloudflare version: %s\n' "$previous_version" >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4.168.0 deploy --strict --tag "$GITHUB_SHA" --message "GitHub $GITHUB_SHA"
          node tools/verify-worker-deploy.mjs after >> "$GITHUB_STEP_SUMMARY"
