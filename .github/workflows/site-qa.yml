name: Site QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python ohje/generate.py
      - run: git -c core.whitespace=cr-at-eol diff --ignore-space-at-eol --exit-code -- ohje/index.html
      - run: python ohje/validate.py
      - run: node --test tools/site.test.mjs
      - run: node tools/build.mjs
